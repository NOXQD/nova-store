<!DOCTYPE html>
<!-- === PRODUCT.HTML === -->
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Товар — NOVA STORE</title>
  <meta name="description" content="Страница товара — учебный интернет-магазин NOVA STORE">
  <link rel="stylesheet" href="css/style.css?v=9">
  <script>document.documentElement.dataset.theme = localStorage.getItem("novastore_theme") || "midnight";</script>
</head>
<body>

  <div id="app-header"></div>

  <main>
    <div class="container product-page">
      <nav class="breadcrumb" id="breadcrumb" aria-label="Хлебные крошки">
        <a href="index.html">Каталог</a>
        <span class="breadcrumb-sep">/</span>
        <span class="breadcrumb-current">Загрузка...</span>
      </nav>

      <!-- Skeleton, пока грузится API -->
      <div class="product-layout" id="productSkeleton">
        <div class="skeleton product-photo-skeleton"></div>
        <div class="product-info-skeleton">
          <div class="skeleton skeleton-line w-30"></div>
          <div class="skeleton skeleton-line w-90 tall"></div>
          <div class="skeleton skeleton-line w-60 tall"></div>
          <div class="skeleton skeleton-line w-40"></div>
          <div class="skeleton skeleton-line w-100"></div>
          <div class="skeleton skeleton-line w-100"></div>
          <div class="skeleton skeleton-line w-80"></div>
          <div class="skeleton skeleton-btn wide"></div>
        </div>
      </div>

      <!-- Контент товара (рендерится из JS) -->
      <div class="product-layout fade-in" id="productContent" hidden></div>

      <!-- Отзывы -->
      <section class="reviews-section glass-card" id="reviewsSection" hidden>
        <div class="reviews-head">
          <h2>Отзывы <span id="reviewsCount"></span></h2>
          <span class="ai-badge" title="Спам, ссылки и оскорбления отфильтровываются автоматически">🛡 ИИ-модерация</span>
        </div>

        <form class="review-form" id="reviewForm" novalidate>
          <div class="review-stars-input" id="reviewStarsInput" aria-label="Ваша оценка">
            <button type="button" data-rate="1">★</button>
            <button type="button" data-rate="2">★</button>
            <button type="button" data-rate="3">★</button>
            <button type="button" data-rate="4">★</button>
            <button type="button" data-rate="5">★</button>
          </div>
          <div class="form-field">
            <input type="text" id="reviewText" placeholder=" " maxlength="400">
            <label for="reviewText">Поделитесь впечатлениями о товаре</label>
            <span class="field-error" id="reviewError"></span>
          </div>
          <button type="submit" class="btn btn-primary">Оставить отзыв</button>
        </form>

        <div class="reviews-list" id="reviewsList"></div>
      </section>

      <!-- Рекомендации -->
      <section class="recs-section" id="similarSection" hidden>
        <h2 class="section-title">Похожие товары</h2>
        <div class="recs-row" id="similarRow"></div>
      </section>
      <section class="recs-section" id="alsoBuySection" hidden>
        <h2 class="section-title">С этим часто берут</h2>
        <div class="recs-row" id="alsoBuyRow"></div>
      </section>

      <!-- Ошибка -->
      <div class="catalog-error" id="productError" hidden>
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <h3 id="productErrorTitle">Товар не найден</h3>
        <p id="productErrorText">Возможно, ссылка устарела или товар был удалён</p>
        <a href="index.html" class="btn btn-primary">← Вернуться в каталог</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 NOVA STORE. Учебный проект — данные из <a href="https://fakestoreapi.com" target="_blank" rel="noopener">Fake Store API</a></p>
    </div>
  </footer>

  <script src="js/models.js?v=9"></script>
  <script src="js/api.js?v=9"></script>
  <script src="js/common.js?v=9"></script>
  <script src="js/chat.js?v=9"></script>
  <script src="js/product.js?v=9"></script>
</body>
</html>
