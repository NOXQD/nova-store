<!DOCTYPE html>
<!-- === INDEX.HTML === -->
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA STORE — Каталог товаров</title>
  <meta name="description" content="Маркетплейс NOVA STORE: электроника, одежда, косметика и товары продавцов">
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>

  <div id="app-header"></div>

  <main>
    <!-- Карусель акций и скидок -->
    <section class="container" id="deals">
      <div class="hero-carousel" id="heroCarousel" hidden>
        <div class="carousel-track" id="carouselTrack"></div>
        <button type="button" class="carousel-arrow carousel-prev" id="carouselPrev" aria-label="Назад">‹</button>
        <button type="button" class="carousel-arrow carousel-next" id="carouselNext" aria-label="Вперёд">›</button>
        <div class="carousel-dots" id="carouselDots"></div>
      </div>
      <div class="hero-carousel-skeleton skeleton" id="carouselSkeleton"></div>
    </section>

    <!-- Каталог -->
    <section class="catalog container" id="catalog">
      <h2 class="section-title">Каталог</h2>
      <div class="catalog-controls">
        <div class="filters-wrap">
          <div class="filters" id="categoryFilters">
            <button type="button" class="filter-pill active" data-category="all">Все товары</button>
            <span class="filter-indicator" id="filterIndicator" aria-hidden="true"></span>
          </div>
        </div>

        <div class="search-sort">
          <select id="sortSelect" class="sort-select" aria-label="Сортировка">
            <option value="default">По умолчанию</option>
            <option value="discount">По размеру скидки</option>
            <option value="price-asc">Сначала дешевле</option>
            <option value="price-desc">Сначала дороже</option>
            <option value="name-asc">Название: А → Я</option>
            <option value="name-desc">Название: Я → А</option>
          </select>
        </div>
      </div>

      <div class="products-grid" id="productsGrid"></div>

      <div class="catalog-empty" id="catalogEmpty" hidden>
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
        <h3>Ничего не найдено</h3>
        <p>Попробуйте изменить запрос или выбрать другую категорию</p>
      </div>

      <div class="catalog-error" id="catalogError" hidden>
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <h3>Не удалось загрузить товары</h3>
        <p>Проверьте подключение к интернету и попробуйте снова</p>
        <button type="button" class="btn btn-primary" id="retryBtn">Попробовать снова</button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 NOVA STORE. Учебный проект — данные из <a href="https://fakestoreapi.com" target="_blank" rel="noopener">Fake Store API</a> и <a href="https://dummyjson.com" target="_blank" rel="noopener">DummyJSON</a></p>
    </div>
  </footer>

  <script src="js/models.js?v=5"></script>
  <script src="js/api.js?v=5"></script>
  <script src="js/common.js?v=5"></script>
  <script src="js/chat.js?v=5"></script>
  <script src="js/catalog.js?v=5"></script>
</body>
</html>
